services:
  stats-server:
    build: ./stats/stats-server
    ports:
      - "${STATS_PORT:-9090}:9090"
    depends_on:
      stats-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/stats
      SPRING_DATASOURCE_USERNAME: stats
      SPRING_DATASOURCE_PASSWORD: stats

  stats-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: stats
      POSTGRES_PASSWORD: stats
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "stats", "-d", "stats"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - stats-data:/var/lib/postgresql/data

  ewm-service:
    build: ./ewm-service
    ports:
      - "${EWM_PORT:-8080}:8080"
    depends_on:
      ewm-db:
        condition: service_healthy
      stats-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm
      SPRING_DATASOURCE_USERNAME: ewm
      SPRING_DATASOURCE_PASSWORD: ewm
      STATS_SERVER_URL: http://stats-server:9090

  ewm-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "ewm", "-d", "ewm"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ewm-data:/var/lib/postgresql/data

volumes:
  stats-data:
  ewm-data:
